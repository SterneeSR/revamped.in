<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Symmetrical Black/Charcoal/Graphite Faceted Geometric Sphere -->
  <g transform="translate(60, 60)">
    <!-- Top Cap Facets -->
    <polygon points="0,-52 23,-46 0,-33" fill="#2d2d2d" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,-52 -23,-46 0,-33" fill="#383838" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="23,-46 42,-31 26,-20" fill="#1c1c1c" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="-23,-46 -42,-31 -26,-20" fill="#444444" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,-52 23,-46 42,-31 0,-33" fill="#252525" opacity="0.3" />

    <!-- Upper Middle Facets -->
    <polygon points="0,-33 26,-20 0,0" fill="#202020" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,-33 -26,-20 0,0" fill="#303030" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="26,-20 42,-31 51,-12 36,0" fill="#181818" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="-26,-20 -42,-31 -51,-12 -36,0" fill="#3a3a3a" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="26,-20 36,0 0,0" fill="#151515" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="-26,-20 -36,0 0,0" fill="#282828" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />

    <!-- Outer Equator Rim Facets -->
    <polygon points="42,-31 51,-12 52,12 38,18" fill="#111111" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="-42,-31 -51,-12 -52,12 -38,18" fill="#4a4a4a" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />

    <!-- Lower Middle Facets -->
    <polygon points="0,0 36,0 26,20" fill="#121212" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,0 -36,0 -26,20" fill="#222222" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,0 26,20 0,33" fill="#181818" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,0 -26,20 0,33" fill="#2b2b2b" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="36,0 51,12 38,28 26,20" fill="#0f0f0f" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="-36,0 -51,12 -38,28 -26,20" fill="#323232" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />

    <!-- Bottom Cap Facets -->
    <polygon points="0,33 26,20 42,31 23,46" fill="#141414" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,33 -26,20 -42,31 -23,46" fill="#262626" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,33 23,46 0,52" fill="#191919" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="0,33 -23,46 0,52" fill="#242424" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="26,20 38,28 42,31" fill="#0d0d0d" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
    <polygon points="-26,20 -38,28 -42,31" fill="#2e2e2e" stroke="#141414" stroke-width="0.75" stroke-linejoin="round" />
  </g>
</svg>